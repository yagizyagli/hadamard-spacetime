[package]
name = "hadamard-spacetime"
version = "0.1.0"
edition = "2021"
authors = ["Yağız Yağlı <@yagizyagli>"]
description = "An enterprise-grade relativistic spacetime correction and quantum phase synchronization engine for deep-space navigation networks."
license = "MIT"
readme = "README.md"
